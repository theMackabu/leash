name: build

on:
  push:
    branches:
      - master
      - main
    paths:
      - meson.build
  workflow_dispatch:

jobs:
  macos:
    name: macOS binary
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          install_if_missing() {
            local formula="$1"
            if ! brew list --formula "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          }

          install_if_missing meson
          install_if_missing ninja
          install_if_missing pkgconf

          while IFS= read -r formula; do
            case "$formula" in
              llvm@21) ;;
              llvm@*) brew unlink "$formula" >/dev/null 2>&1 || true ;;
            esac
          done < <(brew list --formula)

          install_if_missing llvm@21
          brew link --overwrite llvm@21 >/dev/null 2>&1 || true

      - name: Use Clang 21
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@21)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          {
            echo "CC=$LLVM_PREFIX/bin/clang"
            echo "OBJC=$LLVM_PREFIX/bin/clang"
            echo "CXX=$LLVM_PREFIX/bin/clang++"
          } >> "$GITHUB_ENV"
          "$LLVM_PREFIX/bin/clang" --version

      - name: Configure
        run: meson setup build --wrap-mode=forcefallback

      - name: Format check
        run: meson compile -C build format-check

      - name: Build
        run: meson compile -C build

      - name: Smoke test
        run: |
          ./build/leash --version
          ./build/leash --help
          ./build/leash build --check ubuntu
          codesign --verify --verbose ./build/leash

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: leash-${{ runner.os }}-${{ runner.arch }}
          path: build/leash
          if-no-files-found: error
